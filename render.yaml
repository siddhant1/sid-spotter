# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: saferoute
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: TOMTOM_API_KEY
        sync: false  # Render asks for this secret when you create the Blueprint
